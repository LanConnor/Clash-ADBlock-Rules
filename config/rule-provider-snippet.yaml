# ============================================================
# 方案 A（推荐）：把这段粘进你自己的 Clash 配置
# 只加一次，之后规则每天自动更新，节点完全不用动
# 示例用的是「白名单 + 去广告」变体；换成别的变体只需改 direct/proxy 两行的路径
# 可用变体见 https://github.com/LanConnor/Clash-ADBlock-Rules#变体一览
# ============================================================

# 1) 追加到配置顶层的 rule-providers（和你已有的合并）
rule-providers:
  sr-adblock:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/LanConnor/Clash-ADBlock-Rules/dist/common/adblock.yaml
    path: ./ruleset/sr-adblock.yaml
    interval: 86400
  sr-direct:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/LanConnor/Clash-ADBlock-Rules/dist/whitelist-ad/direct.yaml
    path: ./ruleset/sr-direct.yaml
    interval: 86400
  sr-proxy:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/LanConnor/Clash-ADBlock-Rules/dist/whitelist-ad/proxy.yaml
    path: ./ruleset/sr-proxy.yaml
    interval: 86400

# 2) 把 rules 段换成下面这些（顺序不能变）
#    代理组名如果不是「🚀 代理」，改成你自己配置里的组名
rules:
  - RULE-SET,sr-adblock,REJECT
  - RULE-SET,sr-direct,DIRECT
  - RULE-SET,sr-proxy,🚀 代理
  - GEOIP,CN,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - MATCH,🚀 代理
